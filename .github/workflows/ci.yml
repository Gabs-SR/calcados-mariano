name: CI

on:
    push:
        branches: ['**']
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - run: npm install

            - name: Lint
              run: npm run lint

            - name: Testes
              run: npm test

            - name: Formatação
              run: npm run format:check

    frontend:
        name: Frontend (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - run: npm install

            - name: Lint
              run: npm run lint

            - name: Testes
              run: npm test

            - name: Build
              run: npm run build
